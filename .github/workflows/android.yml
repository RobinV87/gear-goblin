name: Build Android APK

on:
  pull_request:
    paths:
      - 'android/**'
      - 'src/**'
      - 'capacitor.config.ts'
      - 'package*.json'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0 build-tools;35.0.0'
      - run: npm ci
      - run: npm run android:sync
      - run: ./gradlew --no-daemon assembleDebug
        working-directory: android
      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk Gear-Goblin-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Gear-Goblin-Android
          path: Gear-Goblin-Android.apk
          if-no-files-found: error
          compression-level: 0
