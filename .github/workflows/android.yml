name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'src/**'
      - 'capacitor.config.ts'
      - 'package*.json'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'src/**'
      - 'capacitor.config.ts'
      - 'package*.json'
      - '.github/workflows/android.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a public Android prerelease
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0 build-tools;35.0.0'
      - run: npm ci
      - run: npm run android:sync
      - name: Configure preview signing key
        if: github.ref == 'refs/heads/main'
        env:
          ANDROID_TEST_KEYSTORE_BASE64: ${{ secrets.ANDROID_TEST_KEYSTORE_BASE64 }}
          PUBLISH_ANDROID: ${{ inputs.publish }}
        run: |
          if [[ "$PUBLISH_ANDROID" == "true" && -z "$ANDROID_TEST_KEYSTORE_BASE64" ]]; then
            echo "::error::Set ANDROID_TEST_KEYSTORE_BASE64 before publishing installable updates."
            exit 1
          fi
          if [[ -n "$ANDROID_TEST_KEYSTORE_BASE64" ]]; then
            install -d -m 700 "$HOME/.android"
            umask 077
            printf '%s' "$ANDROID_TEST_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          fi
      - run: ./gradlew --no-daemon "-PgearBuildNumber=$((GITHUB_RUN_NUMBER + 1))" assembleDebug
        working-directory: android
      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk Gear-Goblin-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Gear-Goblin-Android
          path: Gear-Goblin-Android.apk
          if-no-files-found: error
          compression-level: 0


  publish:
    needs: apk
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Gear-Goblin-Android
      - name: Publish the APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          build=$((GITHUB_RUN_NUMBER + 1))
          gh release create "android-build-$build" Gear-Goblin-Android.apk \
            --target "$GITHUB_SHA" --prerelease --title "Gear Goblin Android build $build" \
            --notes "Install the APK on your Android phone. This is a sideload preview."
